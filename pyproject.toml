[project]
name = "neuro-k-sweep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nyss", email = "straussnycolas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "hjson>=3.1.0",
    "mutagen>=1.48.1",
    "thefuzz>=0.22.1",
    "tinytag>=2.3.2",
    "xxhash>=4.1.0",
]

[project.scripts]
neuro-k-sweep = "neuro_k_sweep:main"

# [build-system]
# requires = ["uv_build>=0.13.6,<0.14.0"]
# build-backend = "uv_build"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/neuro_k_sweep",
    "lib/metadata_utils", 
    "lib/karaoke_parser"
    ]