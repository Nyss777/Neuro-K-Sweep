name: Build and Release EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --locked --no-dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable
        run: >
          uv run pyinstaller
          --onefile
          --name neuro_k_sweep
          --paths lib
          --collect-all karaoke_parser
          --collect-all metadata_utils
          src/neuro_k_sweep/main.py

      - name: Rename executable with version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          mv dist/neuro_k_sweep.exe "dist/neuro_k_sweep-${VERSION}.exe"
          echo "ARTIFACT=dist/neuro_k_sweep-${VERSION}-windows.exe" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuro_k_sweep-windows
          path: ${{ env.ARTIFACT }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARTIFACT" \
            --title "Neuro K Sweep $GITHUB_REF_NAME" \
            --generate-notes
