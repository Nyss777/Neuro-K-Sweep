name: Build and Release EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --locked --no-dev

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="build-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build executable
        shell: bash
        run: |
          uv run pyinstaller \
            --onefile \
            --name "neuro_k_sweep-${{ steps.version.outputs.version }}" \
            --paths lib \
            --collect-all karaoke_parser \
            --collect-all metadata_utils \
            src/neuro_k_sweep/main.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuro_k_sweep
          path: dist/neuro_k_sweep-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            "dist/neuro_k_sweep-${VERSION}.exe" \
            --target "$GITHUB_SHA" \
            --title "Neuro K Sweep $VERSION" \
            --generate-notes
